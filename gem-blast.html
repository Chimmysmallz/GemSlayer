<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0420" />
<title>GEM BLAST</title>
<style>
  :root{
    --bg1:#1a0938; --bg2:#0b0420; --accent:#00f0ff; --accent2:#ff2e9a;
    --gap: 6px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #3a0d6e 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #5e0a55 0%, transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color:#fff; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; min-height:100%;
    touch-action:manipulation;
  }
  .wrap{ width:100%; max-width:480px; padding:14px 14px 24px; display:flex; flex-direction:column; gap:12px; }
  header{ text-align:center; margin-top:6px; }
  h1{
    margin:0; font-size:34px; font-weight:900; letter-spacing:4px;
    background:linear-gradient(90deg,var(--accent),#a9f,var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(0,240,255,.45));
  }
  .sub{ font-size:11px; letter-spacing:3px; opacity:.6; margin-top:2px; }

  .hud{ display:flex; gap:10px; }
  .stat{
    flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; padding:9px 6px; text-align:center; backdrop-filter:blur(8px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .stat .k{ font-size:10px; letter-spacing:2px; opacity:.6; }
  .stat .v{ font-size:22px; font-weight:800; margin-top:2px; }
  .stat.score .v{ color:var(--accent); text-shadow:0 0 12px rgba(0,240,255,.6); }
  .stat.moves .v{ color:#ffd34d; }
  .stat.goal .v{ color:var(--accent2); }

  .barwrap{ height:9px; border-radius:6px; background:rgba(255,255,255,.1); overflow:hidden; }
  .bar{ height:100%; width:0%; border-radius:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow:0 0 12px rgba(255,46,154,.6); transition:width .35s ease; }

  .boardwrap{ position:relative; aspect-ratio:1/1; width:100%;
    background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.12);
    border-radius:20px; padding:var(--gap);
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 40px rgba(120,0,200,.25);
  }
  #board{ position:absolute; inset:var(--gap); display:grid; gap:var(--gap); }
  .tile{
    position:relative; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; transition:transform .12s ease, opacity .18s ease, box-shadow .15s;
    will-change:transform;
  }
  .tile .gem{ width:78%; height:78%; border-radius:50% 50% 48% 48%;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    box-shadow:inset 0 -6px 10px rgba(0,0,0,.35), inset 0 6px 10px rgba(255,255,255,.45), 0 4px 10px rgba(0,0,0,.4);
    position:relative; overflow:hidden;
  }
  .tile .gem::after{ content:""; position:absolute; top:10%; left:16%; width:34%; height:24%;
    background:rgba(255,255,255,.7); border-radius:50%; filter:blur(2px); }
  .tile.sel{ transform:scale(1.12); z-index:5; }
  .tile.sel .gem{ box-shadow:0 0 0 3px #fff, 0 0 22px var(--accent), inset 0 -6px 10px rgba(0,0,0,.3); }
  .tile.pop{ animation:pop .26s ease forwards; }
  @keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.3)} 100%{transform:scale(0); opacity:0} }
  .tile.drop{ animation:drop .28s cubic-bezier(.3,1.4,.5,1); }
  @keyframes drop{ from{ transform:translateY(-22px); opacity:.2 } to{ transform:translateY(0); opacity:1 } }

  /* special tiles */
  .tile.sp-line .gem{ box-shadow:0 0 0 2px #fff, 0 0 18px #fff, inset 0 0 10px rgba(255,255,255,.6); }
  .tile.sp-line .gem::before{ content:"✦"; position:absolute; font-size:16px; color:#fff; text-shadow:0 0 8px #fff; }
  .tile.sp-bomb .gem{ animation:pulseGlow 1.1s infinite; }
  @keyframes pulseGlow{ 0%,100%{ filter:brightness(1) } 50%{ filter:brightness(1.6) drop-shadow(0 0 10px #fff) } }
  .tile.sp-bomb .gem::before{ content:"⬢"; position:absolute; font-size:20px; color:#fff; opacity:.85; text-shadow:0 0 10px #fff; }

  .particle{ position:absolute; width:9px; height:9px; border-radius:50%; pointer-events:none; z-index:30;
    box-shadow:0 0 8px currentColor; }

  .combo{ position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) scale(.5);
    font-weight:900; font-size:40px; pointer-events:none; opacity:0; z-index:40;
    color:#fff; text-shadow:0 0 18px var(--accent), 0 0 30px var(--accent2); }
  .combo.show{ animation:combo .8s ease forwards; }
  @keyframes combo{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
    30%{opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}
    100%{opacity:0; transform:translate(-50%,-65%) scale(1) rotate(0)} }

  .controls{ display:flex; gap:10px; }
  button{ flex:1; border:none; border-radius:14px; padding:13px; font-weight:800; letter-spacing:1px;
    font-size:14px; color:#fff; cursor:pointer; transition:transform .1s, filter .2s;
    background:linear-gradient(135deg,var(--accent2),#7a1fd1); box-shadow:0 8px 20px rgba(122,31,209,.45); }
  button.ghost{ background:rgba(255,255,255,.08); box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  button:active{ transform:translateY(2px) scale(.98); }

  .overlay{ position:fixed; inset:0; background:rgba(6,2,18,.86); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .overlay.show{ display:flex; }
  .card{ width:100%; max-width:360px; text-align:center; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15); border-radius:22px; padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .card h2{ margin:0 0 6px; font-size:30px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .card p{ opacity:.8; font-size:14px; line-height:1.5; }
  .big{ font-size:46px; font-weight:900; color:var(--accent); text-shadow:0 0 18px rgba(0,240,255,.6); margin:8px 0; }
  .hint{ font-size:11px; opacity:.5; text-align:center; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>GEM BLAST</h1>
      <div class="sub">TAP &amp; SWAP • MATCH • COMBO</div>
    </header>

    <div class="hud">
      <div class="stat score"><div class="k">SCORE</div><div class="v" id="score">0</div></div>
      <div class="stat moves"><div class="k">MOVES</div><div class="v" id="moves">25</div></div>
      <div class="stat goal"><div class="k">TARGET</div><div class="v" id="goal">2000</div></div>
    </div>

    <div class="barwrap"><div class="bar" id="bar"></div></div>

    <div class="boardwrap">
      <div id="board"></div>
      <div class="combo" id="combo"></div>
    </div>

    <div class="controls">
      <button class="ghost" id="newBtn">↻ NEW GAME</button>
      <button id="shuffleBtn">⚡ SHUFFLE</button>
    </div>
    <div class="hint">Tap two adjacent gems to swap • Match 4+ to forge power gems</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="ovTitle">LEVEL CLEAR!</h2>
      <div class="big" id="ovScore">0</div>
      <p id="ovMsg">You smashed the target. Ready for more?</p>
      <button id="ovBtn">PLAY AGAIN</button>
    </div>
  </div>

<script>
(() => {
  const SIZE = 8;
  const TYPES = [
    { c1:"#ff5470", c2:"#b3003b", e:"🔥" },
    { c1:"#3df5ff", c2:"#0073a8", e:"💎" },
    { c1:"#7dff8a", c2:"#0c8f2e", e:"🍀" },
    { c1:"#ffd34d", c2:"#c98a00", e:"⭐" },
    { c1:"#c77dff", c2:"#6a1fb0", e:"🔮" },
    { c1:"#ff9d4d", c2:"#c25600", e:"🧡" },
  ];
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const movesEl = document.getElementById("moves");
  const goalEl  = document.getElementById("goal");
  const barEl   = document.getElementById("bar");
  const comboEl = document.getElementById("combo");
  const overlay = document.getElementById("overlay");

  boardEl.style.gridTemplateColumns = `repeat(${SIZE},1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${SIZE},1fr)`;

  let grid = [];      // {type, special:null|'line'|'bomb'}
  let tiles = [];     // DOM refs
  let score = 0, moves = 25, goal = 2000;
  let busy = false, sel = null;

  // ---- audio (tiny WebAudio blips) ----
  let actx;
  function beep(freq, dur=0.08, type="triangle", vol=0.05){
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
      o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }

  const rnd = n => Math.floor(Math.random()*n);
  const idx = (r,c) => r*SIZE+c;

  function makeGrid(){
    grid = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      let t;
      do { t = rnd(TYPES.length); }
      while(
        (c>=2 && grid[idx(r,c-1)].type===t && grid[idx(r,c-2)].type===t) ||
        (r>=2 && grid[idx(r-1,c)].type===t && grid[idx(r-2,c)].type===t)
      );
      grid.push({ type:t, special:null });
    }
  }

  function build(){
    boardEl.innerHTML = "";
    tiles = [];
    for(let i=0;i<SIZE*SIZE;i++){
      const d = document.createElement("div");
      d.className = "tile";
      d.dataset.i = i;
      const gem = document.createElement("div");
      gem.className = "gem";
      d.appendChild(gem);
      boardEl.appendChild(d);
      tiles.push(d);
      d.addEventListener("click", () => onTap(i));
      // swipe
      let sx,sy;
      d.addEventListener("touchstart", e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
      d.addEventListener("touchend", e=>{
        const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
        if(Math.abs(dx)<14 && Math.abs(dy)<14) return; // treated as tap
        const r=Math.floor(i/SIZE), c=i%SIZE; let tr=r, tc=c;
        if(Math.abs(dx)>Math.abs(dy)) tc += dx>0?1:-1; else tr += dy>0?1:-1;
        if(tr<0||tr>=SIZE||tc<0||tc>=SIZE) return;
        sel = i; onTap(idx(tr,tc));
      }, {passive:true});
    }
    render();
  }

  function render(){
    for(let i=0;i<grid.length;i++){
      const cell = grid[i], el = tiles[i], gem = el.firstChild;
      el.className = "tile" + (sel===i?" sel":"");
      if(!cell){ gem.style.opacity=0; continue; }
      gem.style.opacity=1;
      const t = TYPES[cell.type];
      gem.style.background = `radial-gradient(circle at 35% 28%, ${t.c1}, ${t.c2})`;
      gem.style.color = "#fff";
      gem.textContent = cell.special ? "" : t.e;
      if(cell.special==="line") el.classList.add("sp-line");
      if(cell.special==="bomb") el.classList.add("sp-bomb");
    }
  }

  function onTap(i){
    if(busy || !grid[i]) return;
    if(sel===null){ sel=i; beep(520); render(); return; }
    if(sel===i){ sel=null; render(); return; }
    const r1=Math.floor(sel/SIZE),c1=sel%SIZE,r2=Math.floor(i/SIZE),c2=i%SIZE;
    if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1){ sel=i; beep(520); render(); return; }
    trySwap(sel,i);
  }

  async function trySwap(a,b){
    busy=true;
    const A=grid[a], B=grid[b];
    // special combos: if either is special, detonate on swap
    if(A.special || B.special){
      swap(a,b); render();
      sel=null;
      await wait(120);
      detonateSpecials([a,b]);
      consumeMove();
      await resolve();
      busy=false; return;
    }
    swap(a,b); render(); beep(660); await wait(160);
    const matches = findMatches();
    if(matches.size===0){
      swap(a,b); render(); beep(200,0.12,"sawtooth"); // invalid wiggle
      sel=null; busy=false; return;
    }
    sel=null;
    consumeMove();
    await resolve();
    busy=false;
  }

  function swap(a,b){ const t=grid[a]; grid[a]=grid[b]; grid[b]=t; }

  function findMatches(){
    const m = new Set();
    const runs = [];
    // rows
    for(let r=0;r<SIZE;r++){
      let run=[0];
      for(let c=1;c<SIZE;c++){
        if(grid[idx(r,c)] && grid[idx(r,c-1)] && grid[idx(r,c)].type===grid[idx(r,c-1)].type) run.push(c);
        else { if(run.length>=3) runs.push(run.map(cc=>idx(r,cc))); run=[c]; }
      }
      if(run.length>=3) runs.push(run.map(cc=>idx(r,cc)));
    }
    // cols
    for(let c=0;c<SIZE;c++){
      let run=[0];
      for(let r=1;r<SIZE;r++){
        if(grid[idx(r,c)] && grid[idx(r-1,c)] && grid[idx(r,c)].type===grid[idx(r-1,c)].type) run.push(r);
        else { if(run.length>=3) runs.push(run.map(rr=>idx(rr,c))); run=[r]; }
      }
      if(run.length>=3) runs.push(run.map(rr=>idx(rr,c)));
    }
    runs.forEach(run=>run.forEach(i=>m.add(i)));
    return { set:m, runs };
  }

  async function resolve(){
    let chain=0;
    while(true){
      const { set, runs } = findMatches();
      if(set.size===0) break;
      chain++;

      // forge specials from long runs (>=4)
      const forge = [];
      runs.forEach(run=>{
        if(run.length>=5) forge.push({ at:run[Math.floor(run.length/2)], sp:"bomb", type:grid[run[0]].type });
        else if(run.length>=4) forge.push({ at:run[Math.floor(run.length/2)], sp:"line", type:grid[run[0]].type });
      });

      // score
      const base = set.size * 30;
      const gained = base * chain;
      score += gained;
      bumpCombo(chain, gained);
      beep(440 + chain*120, 0.1, "square");

      // particles + pop
      set.forEach(i=>{ if(grid[i]){ burst(i, TYPES[grid[i].type].c1); tiles[i].classList.add("pop"); }});
      await wait(260);

      set.forEach(i=> grid[i]=null );
      // place forged specials
      forge.forEach(f=>{ grid[f.at] = { type:f.type, special:f.sp }; });

      gravity();
      render();
      // drop animation
      tiles.forEach(el=>{ if(el.firstChild.style.opacity!=="0") { el.classList.remove("pop"); }});
      refill();
      render();
      tiles.forEach(el=> el.classList.add("drop"));
      await wait(280);
      tiles.forEach(el=> el.classList.remove("drop"));

      updateHUD();
    }
    updateHUD();
    checkEnd();
    if(!hasMoves()){ await wait(300); autoShuffle(); }
  }

  function detonateSpecials(cells){
    const kill = new Set();
    cells.forEach(i=>{
      const cell=grid[i]; if(!cell||!cell.special) return;
      const r=Math.floor(i/SIZE), c=i%SIZE;
      if(cell.special==="line"){
        for(let x=0;x<SIZE;x++){ kill.add(idx(r,x)); kill.add(idx(x,c)); }
      } else if(cell.special==="bomb"){
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const nr=r+dr,nc=c+dc; if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE) kill.add(idx(nr,nc));
        }
        // bomb also clears two extra rings via the cross for "cooler" feel
        for(let x=0;x<SIZE;x++){ kill.add(idx(r,x)); }
      }
    });
    if(kill.size){
      score += kill.size*45;
      bumpCombo(1, kill.size*45);
      beep(140,0.25,"sawtooth",0.08);
      kill.forEach(i=>{ if(grid[i]){ burst(i,"#fff"); tiles[i].classList.add("pop"); }});
      kill.forEach(i=> grid[i]=null);
      setTimeout(()=>{ gravity(); refill(); render(); }, 240);
    }
  }

  function gravity(){
    for(let c=0;c<SIZE;c++){
      let write=SIZE-1;
      for(let r=SIZE-1;r>=0;r--){
        if(grid[idx(r,c)]){ grid[idx(write,c)]=grid[idx(r,c)]; if(write!==r) grid[idx(r,c)]=null; write--; }
      }
      for(let r=write;r>=0;r--) grid[idx(r,c)]=null;
    }
  }
  function refill(){
    for(let i=0;i<grid.length;i++) if(!grid[i]) grid[i]={ type:rnd(TYPES.length), special:null };
  }

  function burst(i, color){
    const el = tiles[i]; const rect = el.getBoundingClientRect();
    const wrapRect = document.querySelector(".boardwrap").getBoundingClientRect();
    const cx = rect.left - wrapRect.left + rect.width/2;
    const cy = rect.top - wrapRect.top + rect.height/2;
    for(let k=0;k<7;k++){
      const p=document.createElement("div");
      p.className="particle"; p.style.color=color; p.style.background=color;
      p.style.left=cx+"px"; p.style.top=cy+"px";
      document.querySelector(".boardwrap").appendChild(p);
      const ang=Math.random()*Math.PI*2, dist=20+Math.random()*46;
      const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      p.animate([
        { transform:"translate(0,0) scale(1)", opacity:1 },
        { transform:`translate(${dx}px,${dy}px) scale(0)`, opacity:0 }
      ], { duration:480+Math.random()*200, easing:"cubic-bezier(.2,.8,.3,1)" });
      setTimeout(()=>p.remove(), 700);
    }
  }

  function bumpCombo(chain, gained){
    if(chain<2 && gained<300) return;
    comboEl.textContent = chain>=2 ? `COMBO ×${chain}` : `+${gained}`;
    comboEl.classList.remove("show"); void comboEl.offsetWidth; comboEl.classList.add("show");
  }

  function consumeMove(){ moves=Math.max(0,moves-1); updateHUD(); }
  function updateHUD(){
    scoreEl.textContent = score;
    movesEl.textContent = moves;
    goalEl.textContent = goal;
    barEl.style.width = Math.min(100, score/goal*100)+"%";
  }

  function hasMoves(){
    // any swap yields a match?
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      const i=idx(r,c);
      [[0,1],[1,0]].forEach(()=>{});
      if(c+1<SIZE && testSwap(i,idx(r,c+1))) return true;
      if(r+1<SIZE && testSwap(i,idx(r+1,c))) return true;
    }
    return false;
  }
  function testSwap(a,b){
    swap(a,b); const has=findMatches().set.size>0; swap(a,b); return has;
  }

  function autoShuffle(){
    do {
      for(let i=grid.length-1;i>0;i--){ const j=rnd(i+1); const t=grid[i]; grid[i]=grid[j]; grid[j]=t; }
    } while(findMatches().set.size>0 || !hasMoves());
    render(); beep(700,0.15);
  }

  function checkEnd(){
    if(score>=goal){ endGame(true); }
    else if(moves<=0){ endGame(false); }
  }
  function endGame(win){
    busy=true;
    document.getElementById("ovTitle").textContent = win ? "LEVEL CLEAR! 🎉" : "OUT OF MOVES";
    document.getElementById("ovScore").textContent = score;
    document.getElementById("ovMsg").textContent = win
      ? "You smashed the target. Next level is tougher!"
      : "So close! Tap below to try again.";
    document.getElementById("ovBtn").textContent = win ? "NEXT LEVEL ▸" : "RETRY";
    overlay.classList.add("show");
    overlay.dataset.win = win ? "1":"0";
    beep(win?880:160, 0.4, win?"triangle":"sawtooth", 0.08);
  }

  function newGame(harder){
    if(harder){ goal = Math.round(goal*1.6); moves = 25; }
    else { goal = 2000; moves = 25; score = 0; }
    if(!harder) score = 0;
    makeGrid(); build(); updateHUD();
    overlay.classList.remove("show");
    busy=false; sel=null;
  }

  const wait = ms => new Promise(r=>setTimeout(r,ms));

  document.getElementById("newBtn").onclick = ()=> newGame(false);
  document.getElementById("shuffleBtn").onclick = ()=>{ if(!busy){ autoShuffle(); } };
  document.getElementById("ovBtn").onclick = ()=>{
    const win = overlay.dataset.win==="1";
    newGame(win); // win => keep score, harder level
  };

  // init
  makeGrid(); build(); updateHUD();
})();
</script>
</body>
</html>
